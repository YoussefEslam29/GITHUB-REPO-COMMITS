name: Daily streak commit

on:
  schedule:
    # Two attempts per day (UTC). GitHub sometimes delays or skips scheduled
    # runs, so the second one is a backup; it does nothing if the first worked.
    - cron: "17 10 * * *"
    - cron: "43 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: streak
  cancel-in-progress: false

jobs:
  commit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Add today's entry and push
        env:
          OWNER: ${{ github.repository_owner }}
          OWNER_ID: ${{ github.repository_owner_id }}
        run: |
          set -euo pipefail

          today=$(date -u +%F)

          if [ -f streak.log ] && grep -q "^${today} " streak.log; then
            echo "Already committed for ${today}, nothing to do."
            exit 0
          fi

          echo "${today} $(date -u +%T)Z" >> streak.log

          # The noreply address is tied to your GitHub account, so the commit
          # counts toward your contribution graph without exposing your email.
          git config user.name "${OWNER}"
          git config user.email "${OWNER_ID}+${OWNER}@users.noreply.github.com"

          git add streak.log
          git commit -m "chore: daily streak ${today}"
          git push
